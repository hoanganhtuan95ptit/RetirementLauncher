// Optimization: Safe loading of local.properties and external config
def localProperties = new Properties()
def localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

// Apply config from retirement_launcher if exists (keep specific logic for signing)
def retirementPath = localProperties.getProperty('module.retirement_launcher')
if (retirementPath != null) {
    def configFile = file("${retirementPath}/config.gradle")
    if (configFile.exists()) {
        apply from: configFile
    }
}

def runGitCommand(List<String> command, def defaultValue) {
    try {
        def process = new ProcessBuilder(command)
                .directory(rootProject.rootDir)
                .redirectErrorStream(true)
                .start()

        process.waitFor()

        if (process.exitValue() == 0) {
            def output = process.inputStream.text.trim()

            if (!output.isEmpty()) {
                return defaultValue instanceof Integer
                        ? output.toInteger()
                        : output
            }
        }

    } catch (Exception e) {
        println("⚠️ Git command failed: ${e.message}")
    }

    return defaultValue
}

def getGitVersionCode() {
    return runGitCommand(
            ['git', 'rev-list', '--count', 'HEAD'],
            1
    )
}

def getGitHash() {
    return runGitCommand(
            ['git', 'rev-parse', '--short', 'HEAD'],
            'dev'
    )
}

android {
    namespace 'com.simple.launcher.retirement'
    compileSdk 36

    signingConfigs {
        keystore {
            keyAlias = project.hasProperty('keyAlias') ? project.ext.keyAlias : ""
            keyPassword = project.hasProperty('keyPassword') ? project.ext.keyPassword : ""
            storeFile = project.hasProperty('storeFile') ? file(project.ext.storeFile) : null
            storePassword = project.hasProperty('storePassword') ? project.ext.storePassword : ""
        }
    }

    defaultConfig {
        applicationId "com.simple.launcher.retirement"
        minSdk 24
        targetSdk 35
        versionCode getGitVersionCode()
        versionName "1.${new Date().format('yy.MM')}.${getGitHash()}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        println("-------------------------------------------")
        println("🚀 Building RetirementLauncher")
        println("📌 Version Code: ${versionCode}")
        println("📌 Version Name: ${versionName}")
        println("-------------------------------------------")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (signingConfigs.keystore.storeFile != null) {
                signingConfig signingConfigs.keystore
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

