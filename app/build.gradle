plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.google.services)
    alias(libs.plugins.crashlytics)
    alias(libs.plugins.firebase.perf)
}

// Optimization: Safe loading of local.properties and external config
def localProperties = new Properties()
def localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

// Apply config from retirement_launcher if exists (keep specific logic for signing)
def retirementPath = localProperties.getProperty('module.retirement_launcher')
if (retirementPath != null) {
    def configFile = file("${retirementPath}/config.gradle")
    if (configFile.exists()) {
        apply from: configFile
    }
}

android {
    namespace 'com.simple.launcher.retirement'
    compileSdk 36

    signingConfigs {
        keystore {
            keyAlias = project.hasProperty('keyAlias') ? project.ext.keyAlias : ""
            keyPassword = project.hasProperty('keyPassword') ? project.ext.keyPassword : ""
            storeFile = project.hasProperty('storeFile') ? file(project.ext.storeFile) : null
            storePassword = project.hasProperty('storePassword') ? project.ext.storePassword : ""
        }
    }

    defaultConfig {
        applicationId "com.simple.launcher.retirement"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (signingConfigs.keystore.storeFile != null) {
                signingConfig signingConfigs.keystore
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.metrics
    implementation libs.gson
    implementation libs.adapter
    ksp libs.adapter.processor
    implementation libs.deeplink
    ksp libs.deeplink.processor
    implementation libs.auto.register
    ksp libs.auto.register.processor
    implementation libs.auto.service
    ksp libs.auto.service.ksp
    implementation libs.glide
    implementation libs.glide.transformations
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.perf

    // Optimization: Automatically implement all modules defined in local.properties
    localProperties.each { key, path ->
        if (key.startsWith("module.")) {
            def moduleName = key.substring("module.".length())
            if (findProject(":${moduleName}") != null) {
                implementation project(":${moduleName}")
            }
        }
    }

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
